<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombia Relief Map</title>
    
    <!-- Critical Structural CSS -->
    <style>
        html, body { height: 100%; margin: 0; display: flex; background-color: #f8f9fa; }
        #sidebar { width: 350px; height: 100%; z-index: 5; display: flex; flex-direction: column; }
        #map { flex-grow: 1; height: 100%; background: #e9ecef; }
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 45%; }
            #map { height: 55%; }
        }
    </style>

    <!-- Async loading for the full stylesheet -->
    <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Deferred Application Script -->
    <script src="app.js" defer></script>
</head>
<body>
    <div id="sidebar">
        <!-- Sidebar content -->
    </div>
    <div id="map"></div>
</body>
</html>
