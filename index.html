<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colombia Relief Donation Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet must load before app.js -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="app.js" defer></script>
</head>

<body>
  <aside id="sidebar">
    <header class="sidebar-header">
      <h1>Colombia Relief Map</h1>
      <p>
        Find current NYC-area donation locations for people affected by the
        Colombia earthquake.
      </p>
    </header>

    <section class="filter-group" aria-label="Donation site filters">
      <label for="zipFilter">Filter donation sites by ZIP code</label>

      <select id="zipFilter">
        <option value="all">All ZIP codes</option>
      </select>

      <button id="locate-btn" type="button">
        📍 Use My Current Location
      </button>

      <p id="timestamp" aria-live="polite"></p>
    </section>

    <section id="directions-panel" aria-live="polite">
      <h2>Route planner</h2>

      <p id="route-status">
        Click or tap the map to set your start point, then select a donation
        site.
      </p>

      <label for="route-mode">Travel mode</label>

      <select id="route-mode">
        <option value="transit">Train / bus / transit</option>
        <option value="drive">Car</option>
        <option value="walk">Walk</option>
        <option value="bicycle">Bike</option>
      </select>

      <ol id="route-instructions"></ol>
    </section>

    <section id="site-list" aria-live="polite">
      <p class="loading-message">Loading verified donation sites…</p>
    </section>
  </aside>

  <main id="map" aria-label="Interactive donation site map"></main>
</body>
</html>
