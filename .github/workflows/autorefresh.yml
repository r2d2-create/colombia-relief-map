name: Auto-Refresh Donation Data

on:
  schedule:
    # Runs automatically every morning at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      - name: Set up Python installation
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scraper requirements
        run: |
          pip install requests

      - name: Run scraper script
        run: python scraper.py

      - name: Commit updated donation data and geocoding cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sites.json geocode_cache.json

          if git diff --staged --quiet; then
            echo "No donation-site data or geocoding-cache changes to commit."
          else
            git commit -m "Update donation site data"
            git push
          fi
