name: Auto-Refresh Donation Data

on:
  schedule:
    # Runs automatically every single morning at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows you to press a manual "Run now" button inside GitHub

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository files
      uses: actions/checkout@v4

    - name: Set up Python installation
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraper Requirements
      run: |
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated sites.json
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add sites.json
        git diff-index --quiet HEAD || (git commit -m "Automated night-sync update of donation data" && git push)
